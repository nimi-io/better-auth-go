# Test databases for the adapter conformance suite and e2e tests.
#   docker compose up -d
#   BA_TEST_POSTGRES_URL=postgres://better_auth:better_auth@localhost:5433/better_auth?sslmode=disable \
#   BA_TEST_MYSQL_DSN='root:root@tcp(localhost:3307)/?parseTime=true' \
#   BA_TEST_MONGO_URI="mongodb://localhost:27018/?directConnection=true" \
#   go test ./...
# The variables are optional (these are the defaults); each test creates and drops its own
# database, so the DSNs must name users allowed to create databases.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: better_auth
      POSTGRES_PASSWORD: better_auth
      POSTGRES_DB: better_auth
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U better_auth"]
      interval: 2s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: better_auth
      MYSQL_USER: better_auth
      MYSQL_PASSWORD: better_auth
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 2s
      timeout: 5s
      retries: 60

  mongo:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"]
      interval: 2s
      timeout: 10s
      retries: 60
